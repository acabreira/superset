<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Devin Automation Dashboard</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; margin: 0; padding: 2rem; background: #f5f5f5; color: #222; }
    h1 { font-size: 1.4rem; margin-bottom: 0.25rem; }
    .subtitle { font-size: 0.85rem; color: #888; margin-bottom: 2rem; }

    .summary { display: flex; gap: 1.5rem; margin-bottom: 2.5rem; }
    .card { background: white; border-radius: 10px; padding: 1.25rem 2rem; box-shadow: 0 1px 4px rgba(0,0,0,0.08); min-width: 160px; }
    .card .value { font-size: 2.5rem; font-weight: 700; }
    .card .label { font-size: 0.8rem; color: #666; margin-top: 0.25rem; text-transform: uppercase; letter-spacing: 0.05em; }

    table { width: 100%; border-collapse: collapse; background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.08); margin-bottom: 3rem; }
    th { background: #fafafa; padding: 0.75rem 1rem; text-align: left; font-size: 0.8rem; color: #888; text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid #eee; }
    td { padding: 0.85rem 1rem; border-top: 1px solid #f0f0f0; font-size: 0.9rem; vertical-align: middle; }
    a { color: #2563eb; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .badge { display: inline-block; padding: 0.2rem 0.6rem; border-radius: 999px; font-size: 0.75rem; font-weight: 600; }
    .badge-success { background: #dcfce7; color: #16a34a; }
    .badge-running { background: #dbeafe; color: #2563eb; }
    .btn-delete { background: none; border: 1px solid #fca5a5; color: #dc2626; border-radius: 6px; padding: 0.2rem 0.6rem; font-size: 0.78rem; cursor: pointer; }
    .btn-delete:hover { background: #fef2f2; }
    .empty { text-align: center; padding: 2.5rem; color: #aaa; font-size: 0.9rem; }

  </style>
</head>
<body>
  <h1>Devin Automation Dashboard</h1>
  <p class="subtitle" id="lastPoll">Last poll: —</p>

  <div class="summary">
    <div class="card">
      <div class="value" id="totalIssues">—</div>
      <div class="label">Issues Dispatched</div>
    </div>
    <div class="card">
      <div class="value" style="color:#16a34a" id="prsOpened">—</div>
      <div class="label">PRs Opened</div>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th>Issue</th>
        <th>Status</th>
        <th>PR</th>
        <th>Session</th>
        <th>Started</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="tableBody">
      <tr><td colspan="5" class="empty">Loading...</td></tr>
    </tbody>
  </table>

  <script>
    function fmt(iso) {
      if (!iso) return '—';
      return new Date(iso).toLocaleString();
    }

    async function load() {
      const res = await fetch('/dashboard/data');
      const { summary, sessions } = await res.json();

      document.getElementById('lastPoll').textContent = `Last poll: ${fmt(new Date().toISOString())}`;
      document.getElementById('totalIssues').textContent = summary.totalIssues;
      document.getElementById('prsOpened').textContent = summary.prsOpened;

      const tbody = document.getElementById('tableBody');
      if (!sessions.length) {
        tbody.innerHTML = '<tr><td colspan="5" class="empty">No issues dispatched yet. Create an issue in acabreira/superset to trigger the automation.</td></tr>';
        return;
      }

      tbody.innerHTML = sessions.map(s => `
        <tr>
          <td><a href="${s.issue_url}" target="_blank">#${s.issue_number}</a> <span style="color:#555;font-size:0.85rem">${s.issue_title}</span></td>
          <td>${s.status === 'success'
            ? '<span class="badge badge-success">✅ PR Opened</span>'
            : s.status === 'terminated'
            ? '<span class="badge" style="background:#f3f4f6;color:#6b7280">🗑 Terminated</span>'
            : '<span class="badge badge-running">🔄 In Progress</span>'
          }</td>
          <td>${s.pr_url ? `<a href="${s.pr_url}" target="_blank">View PR →</a>` : '—'}</td>
          <td><a href="https://app.devin.ai/sessions/${s.session_id}" target="_blank">${s.session_id.slice(0, 8)}…</a></td>
          <td style="font-size:0.82rem;color:#888">${fmt(s.created_at)}</td>
          <td>${s.status === 'terminated' ? '—' : `<button class="btn-delete" onclick="deleteSession('${s.session_id}', this)">Delete Session</button>`}</td>
        </tr>
      `).join('');
    }

    async function deleteSession(sessionId, btn) {
      btn.disabled = true;
      btn.textContent = 'Deleting…';
      try {
        const res = await fetch(`/dashboard/session/${sessionId}`, { method: 'DELETE' });
        const data = await res.json();
        if (data.ok) {
          btn.textContent = 'Deleted';
        } else {
          btn.textContent = 'Error';
          console.error('Delete failed:', data.error);
        }
      } catch (err) {
        btn.textContent = 'Error';
        console.error('Delete error:', err);
      }
      setTimeout(load, 1000);
    }

    load();
    setInterval(load, 15000);
  </script>
</body>
</html>
